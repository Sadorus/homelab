services:
  bill-reminder:
    image: sadorus/bill-tracker:latest
    container_name: bill-tracker
    restart: unless-stopped
    ports:
      - "3000:3002" # host 3000 -> the app's port 3002 inside the container
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - POCKETBASE_URL=${POCKETBASE_URL:-} 
    networks:
      - tailnet
    # Deliberately no depends_on: the app is client-side and needs nothing
    # from PocketBase at boot, so a PocketBase problem leaves the app up
    # (degraded) instead of taking the whole stack down.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "tsbridge.enabled=true"
      - "tsbridge.service.name=bill-tracker"
      - "tsbridge.service.port=3002"

  pocketbase:
    image: adrianmusante/pocketbase:latest
    container_name: bill-tracker-pocketbase
    restart: unless-stopped
    environment:
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-}
      # Encrypt settings (SMTP credentials, OAuth secrets) at rest:
      # - POCKETBASE_ENCRYPTION_KEY=${POCKETBASE_ENCRYPTION_KEY}
      # Email reminders: SMTP lives in the Admin UI; these only move or
      # disable the daily job (docs/email-reminders.md):
      # - PB_REMINDERS_CRON=0 8 * * *
      # - PB_REMINDERS_TZ=Local
      # - PB_REMINDERS_DISABLED=1
    networks:
      - tailnet
    volumes:
      # The whole PocketBase workdir: database, backups, settings.
      # PB_DATA_DIR defaults to the homelab data convention; create it and
      # give it to the container user first (the image runs as uid 1001):
      #   mkdir -p /srv/komodo/data/bill-tracker/pocketbase
      #   chown -R 1001:1001 /srv/komodo/data/bill-tracker/pocketbase
      - ${PB_DATA_DIR:-/srv/komodo/data/bill-tracker/pocketbase}:/pocketbase
      # Schema and reminder hook, read-only — PocketBase only ever reads
      # these, and they matter only at boot (migrations apply once, into
      # pb_data). Absolute paths on purpose: Komodo materializes only the
      # files it tracks — the compose file — so a checkout-relative path
      # here is an empty directory. Copy them into the data area once:
      #   git clone --depth 1 https://github.com/Sadorus/homelab /tmp/h
      #   sudo cp -rT /tmp/h/stacks/bill-tracker/pb_migrations /srv/komodo/data/bill-tracker/pb_migrations
      #   sudo cp -rT /tmp/h/stacks/bill-tracker/pb_hooks     /srv/komodo/data/bill-tracker/pb_hooks
      #   sudo chmod -R a+rX /srv/komodo/data/bill-tracker/pb_{migrations,hooks}
      - /srv/komodo/data/bill-tracker/pb_migrations:/pocketbase/migrations:ro
      - /srv/komodo/data/bill-tracker/pb_hooks:/pocketbase/hooks:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "tsbridge.enabled=true"
      - "tsbridge.service.name=bill-tracker-pb"
      - "tsbridge.service.port=8090"
    security_opt:
      - no-new-privileges:true

# Uncomment when using the named-volume alternative above:
# volumes:
#   pb_data:

networks:
  tailnet:
    external: true
